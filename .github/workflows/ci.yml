name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Rust ${{ matrix.rust-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["stable", "1.75"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203
        with:
          toolchain: ${{ matrix.rust-version }}
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Build
        run: |
          if [ "${{ matrix.rust-version }}" = "1.75" ]; then
            cargo build --no-default-features
          else
            cargo build --all-targets
          fi
      - name: Test
        run: |
          if [ "${{ matrix.rust-version }}" = "1.75" ]; then
            cargo test --no-default-features
          else
            cargo test
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  coverage:
    name: Coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage
        run: |
          output=$(cargo tarpaulin --out xml --output-dir target/tarpaulin 2>&1)
          echo "$output"
          coverage=$(echo "$output" | grep -oP '[\d.]+(?=% coverage)')
          echo "Coverage: ${coverage}%"
          if [ "$(echo "$coverage < 100" | bc)" -eq 1 ]; then
            echo "::error::Coverage is ${coverage}%, expected 100%"
            exit 1
          fi
      - name: Upload to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5.4.2
        with:
          files: target/tarpaulin/cobertura.xml
          fail_ci_if_error: false

  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate conventional commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pattern='^(feat|fix|chore|docs|test|refactor|style|perf|ci|build|revert)(\(.+\))?!?: .+'
          failed=0
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE '^Merge '; then
              continue
            fi
            if ! echo "$msg" | grep -qE "$pattern"; then
              echo "::error::Invalid commit message: $msg"
              echo "  Expected format: <type>: <description>"
              echo "  Valid types: feat, fix, chore, docs, test, refactor, style, perf, ci, build, revert"
              failed=1
            fi
          done < <(git log --format=%s "$base".."$head")
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All commit messages follow conventional commits format."

  backlog-health:
    name: Backlog Health
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check for orphaned issues
        run: |
          if ! command -v bd &>/dev/null; then
            echo "bd not installed, skipping orphan check"
            exit 0
          fi
          output=$(bd orphans --no-db 2>&1) || true
          if echo "$output" | grep -q "No orphaned"; then
            echo "No orphaned issues"
          else
            echo "::warning::Orphaned beads issues found"
            echo "$output"
          fi
